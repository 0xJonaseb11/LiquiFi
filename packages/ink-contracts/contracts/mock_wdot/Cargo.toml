[package]
name = "mock_wdot"
version = "0.1.0"
edition = "2021"
authors = ["LiquiFi"]
[profile.release]
panic = "abort"

[dependencies]
ink = { workspace = true }
scale = { workspace = true }
scale-info = { workspace = true }
liquifi-traits = { path = "../../traits", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
ink_e2e = { version = "5.0.0" }

[lib]
name = "mock_wdot"
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "liquifi-traits/std",
]
ink-as-dependency = []
e2e-tests = []
