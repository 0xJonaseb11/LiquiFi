[package]
name = "lending_pool"
version = "0.1.0"
edition = "2021"

[dependencies]
ink = { workspace = true }
scale = { workspace = true }
scale-info = { workspace = true }
liquifi-traits = { path = "../../traits", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
ink_e2e = { version = "5.1" }

[lib]
name = "lending_pool"
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "liquifi-traits/std",
]
ink-as-dependency = []
e2e-tests = []
