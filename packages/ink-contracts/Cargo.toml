[workspace]
members = [
    "traits",
    "contracts/mock_wdot",
    "contracts/mock_usdc",
    "contracts/price_oracle",
    "contracts/interest_rate_model",
    "contracts/lending_pool",
]
resolver = "2"

[workspace.dependencies]
ink = { version = "5.1", default-features = false }
scale = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
pendzl = { version = "4.0.0-beta.2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = false
panic = "abort"
strip = "symbols"
