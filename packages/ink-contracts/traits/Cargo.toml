[package]
name = "liquifi-traits"
version = "0.1.0"
edition = "2021"

[dependencies]
ink = { workspace = true }
scale = { workspace = true }
scale-info = { workspace = true }
pendzl = { workspace = true, features = ["psp22"] }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "pendzl/std",
]
ink-as-dependency = []
