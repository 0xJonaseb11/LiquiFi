# Dependabot configuration for LiquiFi
# Automates dependency updates for Smart Contracts, Backend, AI, and Frontend

version: 2
updates:
  # Node.js dependencies (Monorepo root, hardhat, nextjs, backend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"

  # Python dependencies (AI Service)
  - package-ecosystem: "pip"
    directory: "/packages/ai-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
